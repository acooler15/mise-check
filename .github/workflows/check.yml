name: check
on:
  push:
  workflow_dispatch:
jobs:
  windows-msvc-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (all targets, msvc)
        run: cargo check --all-targets
      - name: cargo build (release, for manual testing)
        run: |
          cargo build --release -p mise
          cargo build --release -p mise-shim
      - uses: actions/upload-artifact@v4
        with:
          name: mise-windows-x64-fix
          path: |
            target/release/mise.exe
            target/release/mise-shim.exe
